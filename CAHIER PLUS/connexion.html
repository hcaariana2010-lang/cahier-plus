<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cahier+ — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F5EF; --paper-line: #C7D3EA; --ink: #1F2A44; --ink-soft: #4A5573;
    --marge: #D64550; --surligneur: #FFD23F;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 35px, var(--paper-line) 35px, var(--paper-line) 36px);
    color: var(--ink); font-family: 'Work Sans', system-ui, sans-serif; line-height: 1.55;
    min-height: 100%;
  }
  html, body { height: 100%; }
  .marge { position: fixed; top:0; bottom:0; left:64px; width:2px; background:var(--marge); opacity:.55; z-index:0; }
  header, main { position: relative; z-index: 1; }
  header { display:flex; align-items:center; padding: 28px 32px 0 96px; max-width:1100px; margin:0 auto; }
  .logo { font-family:'Kalam',cursive; font-weight:700; font-size:1.5rem; }
  .logo span { color: var(--marge); }
  main {
    max-width: 420px; margin: 0 auto; padding: 48px 32px 80px 96px;
    display: flex; flex-direction: column; justify-content: center; min-height: calc(100% - 90px);
  }
  h1 { font-family:'Kalam',cursive; font-weight:700; font-size: clamp(1.9rem, 4vw, 2.3rem); margin: 0 0 6px; }
  .intro { color: var(--ink-soft); margin: 0 0 28px; font-size: .95rem; }

  .tabs { display: flex; gap: 4px; margin-bottom: 28px; border-bottom: 1.5px solid var(--paper-line); }
  .tab {
    background: none; border: none; font-family: 'Work Sans', sans-serif; font-size: .98rem;
    font-weight: 600; color: var(--ink-soft); padding: 10px 4px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-right: 24px;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--marge); }

  label { display: block; font-size: .88rem; font-weight: 600; margin: 0 0 6px; }
  .champ { margin-bottom: 18px; }
  input, select {
    width: 100%; font-family: 'Work Sans', sans-serif; font-size: 1rem;
    padding: 11px 14px; border: 1.5px solid var(--ink); border-radius: 4px;
    background: #fff; color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--marge); outline-offset: 1px; }

  .row-2 { display: flex; gap: 12px; }
  .row-2 .champ { flex: 1; }

  .signup-only { display: none; }
  .signup-only.show { display: block; }

  .cta {
    width: 100%; background: var(--ink); color: var(--paper); text-decoration: none;
    font-weight: 600; padding: 13px 28px; border-radius: 4px; font-size: 1.02rem;
    border: none; cursor: pointer; font-family: 'Work Sans', sans-serif; margin-top: 6px;
  }
  .cta:hover, .cta:focus-visible { background: var(--ink-soft); }

  .switch-note { text-align: center; font-size: .88rem; color: var(--ink-soft); margin-top: 20px; }
  .switch-note button { background:none; border:none; color: var(--marge); font-weight:600; cursor:pointer; font-size:.88rem; padding:0; }

  @media (max-width: 560px) {
    .marge { left: 20px; }
    header { padding: 24px 20px 0 44px; }
    main { padding: 32px 20px 60px 44px; }
    .row-2 { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>
  <div class="marge" aria-hidden="true"></div>
  <header>
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none;">Cahier<span>+</span></a></div>
  </header>

  <main>
    <h1 id="titre">Content de te revoir</h1>
    <p class="intro" id="sousTitre">Connecte-toi pour retrouver tes cours et ta progression.</p>

    <div class="tabs">
      <button class="tab active" id="tab-connexion">Connexion</button>
      <button class="tab" id="tab-inscription">Inscription</button>
    </div>

    <form>
      <div class="champ signup-only" id="champ-prenom">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" placeholder="Ton prénom">
      </div>

      <div class="row-2 signup-only" id="champ-niveau-row">
        <div class="champ">
          <label for="niveau">Niveau</label>
          <select id="niveau">
            <option>Seconde</option>
            <option>Première</option>
            <option>Terminale</option>
          </select>
        </div>
      </div>

      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="toi@exemple.fr">
      </div>

      <div class="champ">
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" placeholder="••••••••">
      </div>

      <button type="submit" class="cta" id="cta-btn">Se connecter</button>
    </form>

    <div class="switch-note" id="switchNote">
      Pas encore de compte ? <button id="switchBtn">Inscris-toi</button>
    </div>
  </main>

  <script>
    const tabConnexion = document.getElementById('tab-connexion');
    const tabInscription = document.getElementById('tab-inscription');
    const signupFields = document.querySelectorAll('.signup-only');
    const titre = document.getElementById('titre');
    const sousTitre = document.getElementById('sousTitre');
    const ctaBtn = document.getElementById('cta-btn');
    const switchNote = document.getElementById('switchNote');

    function goInscription() {
      tabInscription.classList.add('active'); tabConnexion.classList.remove('active');
      signupFields.forEach(f => f.classList.add('show'));
      titre.textContent = 'Crée ton compte';
      sousTitre.textContent = 'Deux minutes, et tu retrouves tes cours partout.';
      ctaBtn.textContent = "Créer mon compte";
      switchNote.innerHTML = 'Déjà un compte ? <button id="switchBtn2">Connecte-toi</button>';
      document.getElementById('switchBtn2').addEventListener('click', goConnexion);
    }
    function goConnexion() {
      tabConnexion.classList.add('active'); tabInscription.classList.remove('active');
      signupFields.forEach(f => f.classList.remove('show'));
      titre.textContent = 'Content de te revoir';
      sousTitre.textContent = 'Connecte-toi pour retrouver tes cours et ta progression.';
      ctaBtn.textContent = 'Se connecter';
      switchNote.innerHTML = 'Pas encore de compte ? <button id="switchBtn">Inscris-toi</button>';
      document.getElementById('switchBtn').addEventListener('click', goInscription);
    }
    tabConnexion.addEventListener('click', goConnexion);
    tabInscription.addEventListener('click', goInscription);
    document.getElementById('switchBtn').addEventListener('click', goInscription);
  </script>
</body>
</html>
